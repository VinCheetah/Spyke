
[project]
name = "spyke"
version = "0.1.0"
description = "Volleyball data collection, analysis and exploration platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Vincent Gardies" },
]
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
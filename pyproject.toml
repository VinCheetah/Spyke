
[project]
name = "spyke"
version = "0.1.0"
description = "Volleyball data collection, analysis and exploration platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Vincent Gardies" },
]
dependencies = [
    "alembic>=1.18",
    "geoalchemy2>=0.18",
    "httpx>=0.28",
    "pymupdf>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "typer>=0.27.3",
    "bs4>=0.0.2",
    "lxml>=6.1.3",
    "charset-normalizer>=3.5.2",
    "pandas>=3.0.6",
    "rich>=15.0.0",
    "html5>=0.0.9",
    "html5lib>=1.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.8",
]


[project.scripts]
spyke = "spyke.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
]
extraPaths = ["src"]
executionEnvironments = [
  { root = "src" }
]
typeCheckingMode = "strict"
pythonVersion = "3.12"
